<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Vade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f6f5;--kart:#fff;--yazi:#15201c;--soluk:#5f6e69;--cizgi:#e1e7e4;--ana:#0f766e;--ana-yazi:#fff;--ana-acik:#d6efe9;--kirmizi:#c0392b;--kirmizi-acik:#fbe3e0;--turuncu:#a85a06;--turuncu-acik:#fdf0dc;--yesil:#15803d;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0d1311;--kart:#17201d;--yazi:#e7eeeb;--soluk:#93a29c;--cizgi:#29342f;--ana:#2dd4bf;--ana-yazi:#04201c;--ana-acik:#123a34;--kirmizi:#f87171;--kirmizi-acik:#3a1716;--turuncu:#fbbf24;--turuncu-acik:#3a2a0c;--yesil:#4ade80}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--yazi);-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(150px + env(safe-area-inset-bottom))}
h1{font-size:1.6rem;margin:6px 0 14px}
h2{font-size:.95rem;display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 8px;color:var(--soluk);font-weight:600}
a{color:var(--ana)}
.bas{display:flex;align-items:center;gap:6px}.bas h1{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.geri{font-size:2.2rem;line-height:1;text-decoration:none;padding:0 10px 6px 0}
.ozet{background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;border-radius:22px;padding:18px;display:grid;gap:4px;margin-bottom:14px}
.ozet small{opacity:.8}.ozet strong{font-size:2rem;font-variant-numeric:tabular-nums}.ozet>span{opacity:.9;font-size:.9rem}
.ozet .bar{background:rgba(255,255,255,.25)}.ozet .bar i{background:#fff}
.kart{display:block;background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:14px;margin-bottom:10px;color:inherit;text-decoration:none}
.kart:active{transform:scale(.99)}
.ust,.alt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.alt{font-size:.82rem;color:var(--soluk);margin-top:8px}
.tutar,.satir b{font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--cizgi);border-radius:3px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--yesil);border-radius:3px}
.rozet{font-size:.75rem;padding:3px 9px;border-radius:99px;background:var(--cizgi);color:var(--soluk);white-space:nowrap}
.rozet.kirmizi{background:var(--kirmizi-acik);color:var(--kirmizi)}.rozet.turuncu{background:var(--turuncu-acik);color:var(--turuncu)}.rozet.ok{background:var(--ana-acik);color:var(--ana)}
.ozet .rozet{background:rgba(255,255,255,.2);color:#fff}
.kirmizi-yazi{color:var(--kirmizi)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0 14px;scrollbar-width:none}
.chips button{border-radius:99px;padding:7px 16px;white-space:nowrap}
.chips .secili{background:var(--ana);color:var(--ana-yazi);border-color:var(--ana);font-weight:600}
button,.btn{font:inherit;border-radius:12px;padding:12px 16px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);cursor:pointer;text-align:center;display:inline-block}
.kucuk{padding:7px 12px;font-size:.88rem}
.birincil{background:var(--ana);color:var(--ana-yazi);border-color:var(--ana);font-weight:600}
.tehlike{color:var(--kirmizi)}
.genis{width:100%;margin-top:8px}.bosluk{margin-top:30px}
.fab{position:fixed;right:max(20px,calc(50% - 300px));bottom:calc(84px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;background:var(--ana);color:var(--ana-yazi);font-size:2rem;line-height:1;box-shadow:0 8px 20px rgba(0,0,0,.25);padding:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--kart);border-top:1px solid var(--cizgi);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;max-width:200px;text-align:center;padding:10px 0 8px;color:var(--soluk);text-decoration:none;font-size:.75rem;display:grid;justify-items:center;gap:3px}
nav a.aktif{color:var(--ana);font-weight:600}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi div{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:14px}
.kpi small{color:var(--soluk);font-size:.82rem}.kpi b{display:block;font-size:1.15rem;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .yesil b{color:var(--yesil)}.kpi .vurgu{background:var(--ana-acik);border-color:transparent}.kpi .vurgu b{color:var(--ana)}
.kutu{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;margin:0;padding:2px 14px}
.kutu.metin{padding:4px 14px;color:var(--soluk);font-size:.92rem}
dl.kutu>div{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--cizgi)}
dl.kutu>div:last-child,.satir:last-child{border-bottom:0}
dt{color:var(--soluk)}dd{margin:0;text-align:right;overflow-wrap:anywhere}
.satir{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--cizgi)}
.satir small{display:block;color:var(--soluk);font-size:.82rem}
.belgeler{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.belgeler button{padding:0;overflow:hidden;aspect-ratio:1;position:relative}
.belgeler img{width:100%;height:100%;object-fit:cover;display:block}
.belgeler span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem;padding:2px 7px;border-radius:99px}
img.tam{width:100%;border-radius:12px}
.bos{text-align:center;color:var(--soluk);padding:24px 12px;margin:0}
.not{margin:0;color:var(--soluk)}
dialog{border:0;border-radius:22px;padding:0;width:min(560px,calc(100% - 20px));max-height:calc(100% - 20px);background:var(--kart);color:var(--yazi)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{padding:18px;display:grid;gap:12px}
dialog h2{margin:0;color:var(--yazi);font-size:1.25rem}
label{display:grid;gap:5px;font-size:.85rem;color:var(--soluk)}
label.btn{display:block;color:var(--yazi);font-size:1rem}
input,select,textarea{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--cizgi);border-radius:12px;background:var(--bg);color:var(--yazi);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ana);outline-offset:-1px}
.ara{margin-top:2px}
fieldset{border:0;padding:0;margin:0;min-width:0}legend{font-size:.85rem;color:var(--soluk);margin-bottom:5px;padding:0}
.seg{display:flex;background:var(--bg);border:1px solid var(--cizgi);border-radius:12px;padding:3px}
.seg label{flex:1;display:block}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:block;text-align:center;padding:9px 4px;border-radius:9px;color:var(--yazi);font-size:.9rem}
.seg input:checked+span{background:var(--ana);color:var(--ana-yazi);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--ana)}
.iki{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dugmeler{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.hata{color:var(--kirmizi);margin:0}
label small{font-size:.78rem}
.uyari{display:flex;align-items:center;gap:10px;background:var(--turuncu-acik);color:var(--turuncu);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:.88rem}
.uyari button{flex-shrink:0}
.ust-bosluk{margin-top:8px}
a.btn{text-decoration:none}
.satir.ay{display:grid;grid-template-columns:7.5em 1fr auto;align-items:center}
.satir.ay i{display:block;height:8px;border-radius:4px;background:var(--ana);min-width:4px}
.kucuk-yazi{font-size:.82rem;margin-top:6px}
.not-kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.not-kart p{margin:8px 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}.not-kart small{color:var(--soluk);font-size:.78rem}
.satir-btn{width:100%;border:0;border-bottom:1px solid var(--cizgi);border-radius:0;background:none;padding:11px 0;text-align:left}
.kilit{position:fixed;inset:0;z-index:10;background:var(--bg);display:grid;place-items:center}
.kilit form{display:grid;gap:12px;width:min(280px,80%);justify-items:center;text-align:center}
.kilit img{border-radius:18px}.kilit h1{margin:0}
.kilit input{text-align:center;font-size:1.4rem;letter-spacing:.4em}.kilit button{width:100%}
</style>
</head>
<body>
<main id="main"></main>
<button class="fab" data-act="yeni" aria-label="Yeni alacak">+</button>
<nav>
  <a href="#/" data-sekme="liste"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Alacaklar</a>
  <a href="#/rapor" data-sekme="rapor"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Raporlar</a>
  <a href="#/notlar" data-sekme="notlar"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/></svg>Notlar</a>
  <a href="#/ayarlar" data-sekme="ayarlar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Ayarlar</a>
</nav>
<script type="module" src="app.js"></script>
</body>
</html>
